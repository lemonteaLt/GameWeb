<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏工坊管理后台 - 极光游戏港</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .admin-container {
      max-width: 1080px;
      margin: 32px auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-input, .form-select, .form-textarea {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all var(--transition-fast);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .form-select option {
      background: #0f172a;
      color: #fff;
    }

    .file-dropzone {
      border: 2px dashed var(--glass-border);
      border-radius: var(--radius-md);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      transition: all var(--transition-fast);
    }

    .file-dropzone:hover, .file-dropzone.dragover {
      border-color: var(--accent-color);
      background: rgba(99, 102, 241, 0.08);
    }

    .btn-primary {
      padding: 12px 28px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all var(--transition-fast);
    }

    .btn-primary:hover {
      background: #4f46e5;
      transform: translateY(-2px);
    }

    .manage-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .manage-table th, .manage-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--glass-border);
    }

    .manage-table th {
      color: var(--text-muted);
      font-size: 13px;
    }

    .danger-btn {
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      cursor: pointer;
    }

    .danger-btn:hover {
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- 后台顶栏 -->
    <header class="glass-panel admin-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="brand-logo" style="font-size: 20px;">⚙️</div>
        <div>
          <h1 style="font-size: 20px; font-weight: 700;">游戏工坊与发布后台</h1>
          <p style="font-size: 13px; color: var(--text-muted);">在此上传新游戏文件或代码，即刻同步上架主站</p>
        </div>
      </div>
      <a href="index.html" class="action-link-btn">
        <span>←</span> 返回玩家大厅
      </a>
    </header>

    <!-- 上传/新增游戏表单 -->
    <section class="glass-panel" style="padding: 32px;">
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
        <span>🚀</span> 上传并发布新游戏
      </h2>

      <form id="addGameForm" class="form-grid">
        <div class="form-group">
          <label class="form-label">游戏名称 *</label>
          <input type="text" id="gameTitle" class="form-input" placeholder="例如：太空战机" required>
        </div>

        <div class="form-group">
          <label class="form-label">所属分类 *</label>
          <select id="gameCategory" class="form-select" required>
            <option value="puzzle">🧩 益智解谜</option>
            <option value="action">⚡ 敏捷反应</option>
            <option value="arcade">🎮 复古街机</option>
            <option value="board">♟️ 策略棋牌</option>
            <option value="casual">🛋️ 休闲解压</option>
            <option value="custom" selected>🛠️ 玩家工坊</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">游戏图标 (Emoji) *</label>
          <input type="text" id="gameIcon" class="form-input" value="🚀" placeholder="例如：🚀, ⚔️, 🏎️" required>
        </div>

        <div class="form-group">
          <label class="form-label">操作指引说明</label>
          <input type="text" id="gameControls" class="form-input" placeholder="例如：【WASD】移动，【空格】射击">
        </div>

        <div class="form-group full-width">
          <label class="form-label">游戏玩法介绍</label>
          <textarea id="gameDescription" class="form-textarea" rows="3" placeholder="简要介绍游戏玩法和目标..."></textarea>
        </div>

        <!-- 游戏文件上传区 -->
        <div class="form-group full-width">
          <label class="form-label">游戏文件导入 (支持单个 .html 文件或网页游戏代码) *</label>
          <div id="dropzone" class="file-dropzone">
            <div style="font-size: 32px; margin-bottom: 8px;">📁</div>
            <div style="font-size: 14px; font-weight: 600;">点击或拖拽游戏 HTML 文件到此处</div>
            <div id="fileNameDisplay" style="font-size: 12px; color: var(--accent-secondary); margin-top: 6px;"></div>
            <input type="file" id="gameFileInput" accept=".html,.htm" style="display: none;">
          </div>
        </div>

        <!-- 或者直接粘贴 HTML 代码 -->
        <div class="form-group full-width">
          <label class="form-label">或者直接粘贴 HTML5 / Canvas 源码</label>
          <textarea id="gameRawHtml" class="form-textarea" rows="5" placeholder="<!DOCTYPE html><html>... 粘贴完整游戏代码"></textarea>
        </div>

        <div class="form-group full-width" style="display: flex; justify-content: flex-end; margin-top: 12px;">
          <button type="submit" class="btn-primary">✨ 立即发布到主站</button>
        </div>
      </form>
    </section>

    <!-- 已上传自定义游戏管理列表 -->
    <section class="glass-panel" style="padding: 32px;">
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
        <span>📋</span> 已发布的自制游戏库
      </h2>
      <div id="customGamesList">
        <!-- 动态生成自制游戏表格 -->
      </div>
    </section>
  </div>

  <script src="js/games-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
