<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新中式极简 · 中国象棋</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Noto Serif SC for elegant Chinese typography -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header / Navigation -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-badge">
          <span class="badge-icon">楚汉</span>
        </div>
        <div class="brand-text">
          <h1>中国象棋</h1>
          <span class="subtitle">CHINESE CHESS · 新中式极简</span>
        </div>
      </div>
      
      <div class="header-controls">
        <button id="btn-sound-toggle" class="icon-btn" title="音效开关" aria-label="音效">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20">
            <path id="sound-icon-path" fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
        <button id="btn-settings-toggle" class="icon-btn" title="设置" aria-label="设置">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Game Area -->
    <main class="game-layout">
      <!-- Left / Top Info: Black Player -->
      <section class="player-card black-card" id="black-player-card">
        <div class="player-info">
          <div class="player-avatar black-avatar">
            <span class="avatar-char">將</span>
          </div>
          <div class="player-details">
            <div class="name-row">
              <span class="player-name" id="black-player-name">执黑 · 电脑 (AI)</span>
              <span class="turn-pill" id="black-turn-pill">思考中...</span>
            </div>
            <div class="timer-row">
              <span class="step-count" id="black-step-count">步数: 0</span>
              <span class="time-display" id="black-timer">00:00</span>
            </div>
          </div>
        </div>
        <div class="captured-tray" id="black-captured-tray" title="黑方吃掉的红方棋子">
          <!-- Captured red pieces injected here -->
        </div>
      </section>

      <!-- Center Board Wrapper -->
      <section class="board-wrapper">
        <!-- Floating Alerts & Status Banner -->
        <div class="status-banner" id="status-banner">
          <span class="status-text" id="status-text">红方先行 · 局始</span>
        </div>

        <!-- Check! / Win Overlay Banner (Animated) -->
        <div class="check-banner" id="check-banner">
          <span class="check-title" id="check-title">将 军</span>
        </div>

        <!-- The Chinese Chess Board Canvas / Grid Container -->
        <div class="chess-board-container" id="chess-board-container">
          <div class="board-outer-frame">
            <div class="board-inner" id="chess-board">
              <!-- SVG Board Background (Lines, River, Palace Diagonals, Position Markers) -->
              <svg class="board-svg-grid" id="board-svg" viewBox="0 0 720 800" preserveAspectRatio="xMidYMid meet">
                <!-- Defs for patterns and filters -->
                <defs>
                  <linearGradient id="riverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2a333c" stop-opacity="0.04" />
                    <stop offset="50%" stop-color="#2a333c" stop-opacity="0.09" />
                    <stop offset="100%" stop-color="#2a333c" stop-opacity="0.04" />
                  </linearGradient>
                  <linearGradient id="boardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fdfbf7" />
                    <stop offset="100%" stop-color="#f4eee1" />
                  </linearGradient>
                </defs>
                
                <!-- Board Base Plate -->
                <rect x="0" y="0" width="720" height="800" rx="16" fill="url(#boardBgGrad)" />
                <rect x="20" y="20" width="680" height="760" rx="10" fill="none" stroke="#2c3437" stroke-width="2.5" stroke-opacity="0.75" />
                <rect x="28" y="28" width="664" height="744" rx="6" fill="none" stroke="#2c3437" stroke-width="1" stroke-opacity="0.35" />

                <!-- Grid Lines (Generated/Drawn in SVG) -->
                <g id="svg-grid-lines" stroke="#2c3437" stroke-width="1.2" stroke-opacity="0.65"></g>

                <!-- River Area -->
                <rect x="40" y="360" width="640" height="80" fill="url(#riverGradient)" />
                <text x="180" y="412" class="river-text" fill="#2c3437" fill-opacity="0.45" font-family="'Noto Serif SC', 'ZCOOL XiaoWei', serif" font-size="28" font-weight="600" letter-spacing="14">楚 河</text>
                <text x="440" y="412" class="river-text" fill="#2c3437" fill-opacity="0.45" font-family="'Noto Serif SC', 'ZCOOL XiaoWei', serif" font-size="28" font-weight="600" letter-spacing="14">漢 界</text>

                <!-- Palace Diagonals -->
                <g id="svg-palace-lines" stroke="#2c3437" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.55"></g>

                <!-- Position Markers ('+' crosses for Cannons and Soldiers) -->
                <g id="svg-cross-markers" stroke="#2c3437" stroke-width="1.2" stroke-opacity="0.6"></g>
              </svg>

              <!-- Layer for Animated Piece Elements -->
              <div class="board-pieces-layer" id="board-pieces"></div>

              <!-- Layer for Highlights (Last Move, Selected Piece, Legal Moves) -->
              <div class="board-indicators-layer" id="board-indicators"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Right / Bottom Info: Red Player -->
      <section class="player-card red-card active-turn" id="red-player-card">
        <div class="player-info">
          <div class="player-avatar red-avatar">
            <span class="avatar-char">帥</span>
          </div>
          <div class="player-details">
            <div class="name-row">
              <span class="player-name" id="red-player-name">执红 · 玩家 (先手)</span>
              <span class="turn-pill" id="red-turn-pill">轮到走棋</span>
            </div>
            <div class="timer-row">
              <span class="step-count" id="red-step-count">步数: 0</span>
              <span class="time-display" id="red-timer">00:00</span>
            </div>
          </div>
        </div>
        <div class="captured-tray" id="red-captured-tray" title="红方吃掉的黑方棋子">
          <!-- Captured black pieces injected here -->
        </div>
      </section>

      <!-- Side / Control Panel (Toolbar & History) -->
      <aside class="game-sidebar">
        <!-- Quick Action Bar -->
        <div class="panel-card actions-panel">
          <h2 class="panel-title">对局操作</h2>
          <div class="action-grid">
            <button id="btn-undo" class="btn btn-outline" title="撤销上一步走棋">
              <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
              <span>悔 棋</span>
            </button>
            <button id="btn-hint" class="btn btn-outline" title="获取最佳走法建议">
              <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-1.3l-.85-.6C7.8 13.08 7 11.64 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 2.64-.8 4.08-2.15 5.1z"/></svg>
              <span>提 示</span>
            </button>
            <button id="btn-flip" class="btn btn-outline" title="翻转红黑视角">
              <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
              <span>翻 转</span>
            </button>
            <button id="btn-restart" class="btn btn-primary" title="重新开始新对局">
              <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              <span>新 局</span>
            </button>
          </div>
        </div>

        <!-- Mode & Settings Summary -->
        <div class="panel-card mode-panel">
          <div class="mode-header">
            <span class="panel-label">对弈模式</span>
            <span class="mode-tag" id="current-mode-tag">人机对战 · 中级</span>
          </div>
          <div class="mode-selectors">
            <div class="radio-group">
              <button class="mode-tab active" data-mode="ai">人机对战</button>
              <button class="mode-tab" data-mode="pvp">双人同屏</button>
              <button class="mode-tab" data-mode="demo">AI观战</button>
            </div>
            <!-- AI Difficulty sub-selection (hidden in pvp) -->
            <div class="ai-difficulty-wrap" id="ai-difficulty-wrap">
              <label for="ai-difficulty-select">AI 棋力：</label>
              <select id="ai-difficulty-select" class="custom-select">
                <option value="easy">初窥门径 (新手入门)</option>
                <option value="medium" selected>登堂入室 (进阶博弈)</option>
                <option value="hard">炉火纯青 (大师深度)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Move History / Notation Record (棋谱) -->
        <div class="panel-card history-panel">
          <div class="history-header">
            <h2 class="panel-title">棋谱记谱</h2>
            <button id="btn-export-pgn" class="text-link-btn" title="复制棋谱文本">导出文本</button>
          </div>
          <div class="history-list-wrapper" id="history-scroll-box">
            <table class="history-table" id="history-table">
              <thead>
                <tr>
                  <th width="20%">回合</th>
                  <th width="40%">红 方</th>
                  <th width="40%">黑 方</th>
                </tr>
              </thead>
              <tbody id="history-table-body">
                <!-- Move rows dynamically added here -->
              </tbody>
            </table>
            <div class="empty-history-tip" id="empty-history-tip">虚席以待，执红起手</div>
          </div>
        </div>
      </aside>
    </main>

    <!-- Game Over Modal -->
    <div class="modal-backdrop" id="game-over-modal">
      <div class="modal-card">
        <div class="modal-seal" id="modal-seal">胜</div>
        <h3 class="modal-title" id="modal-result-title">红方胜出</h3>
        <p class="modal-desc" id="modal-result-desc">绝杀！黑方已无路可走。</p>
        <div class="modal-stats" id="modal-stats">
          <div class="stat-item">
            <span class="stat-num" id="stat-total-turns">0</span>
            <span class="stat-label">总回合数</span>
          </div>
          <div class="stat-item">
            <span class="stat-num" id="stat-total-time">00:00</span>
            <span class="stat-label">对局用时</span>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary btn-block" id="btn-modal-restart">再来一局</button>
          <button class="btn btn-outline btn-block" id="btn-modal-close">查看棋盘</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-backdrop" id="settings-modal">
      <div class="modal-card">
        <div class="settings-modal-header">
          <h3 class="modal-title">偏好设置</h3>
          <button class="close-btn" id="btn-close-settings">&times;</button>
        </div>
        <div class="settings-group">
          <div class="setting-item">
            <div class="setting-text">
              <span class="setting-title">游戏音效</span>
              <span class="setting-desc">下棋、吃子、将军与胜负音效</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-sound" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item">
            <div class="setting-text">
              <span class="setting-title">走法与将军提示</span>
              <span class="setting-desc">高亮落子点及最后一步轨迹</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-hints" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item">
            <div class="setting-text">
              <span class="setting-title">棋子平滑动画</span>
              <span class="setting-desc">落子滑动及被吃淡出动效</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="setting-animation" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item">
            <div class="setting-text">
              <span class="setting-title">玩家阵营 (人机模式)</span>
              <span class="setting-desc">选择执红先行或执黑后手</span>
            </div>
            <div class="side-picker">
              <button class="side-btn active" data-side="r">执红先行</button>
              <button class="side-btn" data-side="b">执黑后手</button>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary btn-block" id="btn-save-settings">保 存</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
